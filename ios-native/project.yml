name: MyShop
options:
  bundleIdPrefix: com.demo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: true
    INFOPLIST_FILE: MyShop/Info.plist
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  PopupBridge:
    url: https://github.com/braintree/popup-bridge-ios
    from: "3.0.0"

targets:
  MyShop:
    type: application
    platform: iOS
    sources:
      - MyShop
    dependencies:
      - package: PopupBridge
    settings:
      base:
        INFOPLIST_FILE: MyShop/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.demo.myshop
        INFOPLIST_KEY_CFBundleDisplayName: MyShop
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
